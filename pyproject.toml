[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "banking-coursework"
version = "0.1.0"
description = "Курсовая: анализ банковских транзакций"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "VITAL", email = "zinabir7@gmail.com"}
]

[tool.poetry.dependencies]
python = ">=3.14"
pandas = ">=2.0.0"
openpyxl = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
mypy = "^1.0.0"
black = "^24.0.0"
flake8 = "^7.0.0"
ruff = "^0.15.20"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=html"

[tool.black]
line-length = 109
target-version = ["py312"]

[tool.flake8]
max-line-length = 109
extend-ignore = ["E203"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [".venv/", ".idea/", "__pycache__/"]

[tool.poetry]
package-mode = false
